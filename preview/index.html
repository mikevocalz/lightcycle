<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Light Cycle — Six Color Runtime Preview</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:Inter,system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%}
    .hud{position:fixed;left:20px;top:20px;padding:14px 16px;border:1px solid #27313a;background:#081019d9;backdrop-filter:blur(12px);border-radius:12px}
    .title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
    .colors{display:flex;gap:8px;flex-wrap:wrap;max-width:330px}
    button{border:1px solid #394956;background:#101820;color:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}
    button[data-active="true"]{outline:2px solid currentColor;outline-offset:2px}
    .status{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:10px;opacity:.72}
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div class="title">One GLB · Runtime Energy</div>
    <div class="colors" id="colors"></div>
    <div class="status" id="status">loading lightcycle.runtime.glb…</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
