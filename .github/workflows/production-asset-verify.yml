name: production-asset-verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightcycle-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Install Blender headless EGL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install Blender 5.2.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install native gltfpack 1.3
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL https://github.com/zeux/meshoptimizer/releases/download/v1.3/gltfpack-ubuntu.zip -o "$RUNNER_TEMP/gltfpack.zip"
          mkdir -p "$RUNNER_TEMP/gltfpack"
          unzip -j -o "$RUNNER_TEMP/gltfpack.zip" -d "$RUNNER_TEMP/gltfpack"
          chmod +x "$RUNNER_TEMP/gltfpack/gltfpack"
          echo "$RUNNER_TEMP/gltfpack" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gltfpack/gltfpack" -v

      - name: Python syntax gate
        run: python3 -m compileall -q tools

      - name: TypeScript and runtime tests
        run: |
          npm run typecheck
          npm test

      - name: Rest pose and animation export regression
        run: blender --factory-startup -b --python-exit-code 1 -P tools/check_rest_pose.py

      - name: Build canonical production GLB
        run: npm run build:glb

      - name: Validate canonical contract
        run: npm run validate

      - name: Verify embedded PBR texture contract
        run: python3 tools/check_texture_contract.py assets/export/lightcycle.glb

      - name: Verify preserved wheel geometry and pivots
        run: python3 tools/check_preserved_wheels.py assets/export/lightcycle.glb --report assets/evidence/wheel-preservation.json

      - name: Fixed shell mechanical clearances
        run: blender --factory-startup -b assets/source/lightcycle_blockout.blend --python-exit-code 1 -P tools/check_shell_geometry.py

      - name: Fixed body clearance against solved rider
        run: blender --factory-startup -b assets/source/lightcycle_blockout.blend --python-exit-code 1 -P tools/check_body_rider.py

      - name: Rider ergonomics
        run: npm run rider

      - name: Canopy rider clearance throughout high-speed clips
        run: blender --factory-startup -b assets/source/lightcycle_blockout.blend --python-exit-code 1 -P tools/check_canopy_sweep.py -- --out assets/evidence/canopy-sweep.json

      - name: Pack runtime GLB with KTX2
        run: npm run pack

      - name: Verify packed KTX2 texture contract
        run: python3 tools/check_texture_contract.py assets/export/lightcycle.runtime.glb --require-ktx2

      - name: Build and validate LOD0-LOD3
        run: npm run lods

      - name: Verify LOD texture and UV contracts
        run: |
          for lod in 0 1 2 3; do
            python3 tools/check_texture_contract.py "assets/export/lightcycle.lod${lod}.glb"
            python3 tools/check_texture_contract.py "assets/export/lightcycle.lod${lod}.runtime.glb" --require-ktx2
          done

      - name: Static asset budgets
        run: npm run profile

      - name: Lights-off and color QA smoke matrix
        run: npm run qa:ci

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightcycle-production-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            assets/source/lightcycle_blockout.blend
            assets/export/lightcycle.glb
            assets/export/lightcycle.runtime.glb
            assets/export/lightcycle.lod*.glb
            assets/export/manifest.json
            assets/export/performance.json
            assets/textures/generated/**
            assets/render/**
            assets/evidence/**
